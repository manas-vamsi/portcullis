services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portcullis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a password}
      POSTGRES_DB: portcullis
    ports:
      # Localhost only. Host port 5433 avoids clashing with a Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portcullis -d portcullis"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
