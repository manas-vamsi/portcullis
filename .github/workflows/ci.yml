name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portcullis
          # Throwaway credential for a service container that lives only for this job.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: portcullis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portcullis -d portcullis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PORTCULLIS_DATABASE_URL: postgresql://portcullis:ci-only@127.0.0.1:5432/portcullis
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --frozen
      - name: Test (unit, Postgres and kill-and-resume)
        run: uv run --no-sync pytest -q --cov=portcullis --cov-report=term-missing
