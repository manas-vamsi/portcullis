[project]
name = "portcullis"
version = "0.1.0"
description = "Deterministic policy, approval and audit layer between AI agents and their tools"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
